name: Build Flutter Web

on:
  push:
    branches:
      - main
    paths:
      - "Docuchat-main/lib/**"
      - "Docuchat-main/web/**"
      - "Docuchat-main/pubspec.yaml"
      - ".github/workflows/build-flutter-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd Docuchat-main
          flutter pub get

      - name: Build Flutter Web (Release)
        run: |
          cd Docuchat-main
          flutter build web --release

      - name: Copy build to server/public
        run: |
          mkdir -p Docuchat-main/server/public
          rm -rf Docuchat-main/server/public/*
          cp -r Docuchat-main/build/web/* Docuchat-main/server/public/

      - name: Commit and push build output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Docuchat-main/server/public
          if git diff --staged --quiet; then
            echo "No changes in server/public to commit."
          else
            git commit -m "build(web): compile Flutter Web release [skip ci]"
            git push origin main
          fi
